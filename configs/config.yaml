# Global experiment seed
seed: 42

# Directory paths
paths:
  raw_dir: "data/raw"
  clean_dir: "data/clean"
  annotation_dir: "data/annotation"
  splits_dir: "data/splits"
  models_dir: "models"
  reports_dir: "reports"

# Steamworks API Scraper configuration
scraper_params:
  filter: "recent"
  language: "english"
  review_type: "all"
  purchase_type: "all"
  num_per_page: 100
  delay_seconds: 1.2
  max_retries: 5

